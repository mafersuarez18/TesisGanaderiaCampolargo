services:
  base-datos:
    image: postgres:16-alpine
    container_name: campolargo-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - datos-postgres-prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-campolargo-prod
    # En producción la BD no expone puerto al exterior
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: produccion
    container_name: campolargo-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@base-datos:5432/${POSTGRES_DB}
      # El schema de Prisma exige DIRECT_URL; sin pooler va igual que DATABASE_URL
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@base-datos:5432/${POSTGRES_DB}
      JWT_SECRETO: ${JWT_SECRETO}
      JWT_SECRETO_REFRESH: ${JWT_SECRETO_REFRESH}
      PUERTO: 3001
      EMAIL_SERVIDOR: ${EMAIL_SERVIDOR}
      EMAIL_PUERTO: ${EMAIL_PUERTO}
      EMAIL_USUARIO: ${EMAIL_USUARIO}
      EMAIL_CLAVE: ${EMAIL_CLAVE}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE}
      URL_FRONTEND: ${URL_FRONTEND}
    ports:
      - "3001:3001"
    depends_on:
      base-datos:
        condition: service_healthy
    networks:
      - red-campolargo-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: produccion
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_NOMBRE_SISTEMA: "Sistema Campolargo"
    container_name: campolargo-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - red-campolargo-prod

volumes:
  datos-postgres-prod:
    driver: local

networks:
  red-campolargo-prod:
    driver: bridge
