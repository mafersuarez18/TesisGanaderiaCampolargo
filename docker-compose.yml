services:
  # Base de datos PostgreSQL
  base-datos:
    image: postgres:16-alpine
    container_name: campolargo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campolargo}
      POSTGRES_USER: ${POSTGRES_USER:-campolargo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campolargo2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campolargo_admin} -d ${POSTGRES_DB:-campolargo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-campolargo

  # Backend Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: campolargo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-campolargo_admin}:${POSTGRES_PASSWORD:-campolargo2026}@base-datos:5432/${POSTGRES_DB:-campolargo}
      # El schema de Prisma exige DIRECT_URL; sin pooler va igual que DATABASE_URL
      DIRECT_URL: postgresql://${POSTGRES_USER:-campolargo_admin}:${POSTGRES_PASSWORD:-campolargo2026}@base-datos:5432/${POSTGRES_DB:-campolargo}
      JWT_SECRETO: ${JWT_SECRETO:-secreto_desarrollo_campolargo_2026}
      JWT_SECRETO_REFRESH: ${JWT_SECRETO_REFRESH:-secreto_refresh_campolargo_2026}
      PUERTO: ${BACKEND_PUERTO:-3001}
      EMAIL_SERVIDOR: ${EMAIL_SERVIDOR:-smtp.gmail.com}
      EMAIL_PUERTO: ${EMAIL_PUERTO:-587}
      EMAIL_USUARIO: ${EMAIL_USUARIO}
      EMAIL_CLAVE: ${EMAIL_CLAVE}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE:-noreply@campolargo.com}
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:5173}
    ports:
      - "${BACKEND_PUERTO:-3001}:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend-node-modules:/app/node_modules
    depends_on:
      base-datos:
        condition: service_healthy
    networks:
      - red-campolargo
    command: npm run dev

  # Frontend React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: campolargo-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
      VITE_NOMBRE_SISTEMA: "Sistema Campolargo"
    ports:
      - "${FRONTEND_PUERTO:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - red-campolargo
    command: npm run dev -- --host

volumes:
  datos-postgres:
    driver: local
  backend-node-modules:
    driver: local
  frontend-node-modules:
    driver: local

networks:
  red-campolargo:
    driver: bridge
